[package]
name = "cdpm"
edition = "2024"

[dependencies]
# Cetus core v10, using the mainnet-v0.10.1 interface.
cetusdlmm = { local = "vendor/cetus-dlmm", override = true }
integer_mate = { git = "https://github.com/CetusProtocol/integer-mate.git", rev = "09a12d9b171122883d9350039d4ed6e8400033b9", override = true }
MoveSTL = { git = "https://github.com/CetusProtocol/move-stl.git", rev = "0681fec63a310ae753d03a06f7c05d3e2925bb09", override = true, rename-from = "move_stl" }

# Scallop lending v20 and its X v2 dependency.
protocol = { local = "vendor/scallop/protocol", override = true }
x = { local = "vendor/scallop/x", override = true }

# Kai SAV v17 and Leverage v21. Both are used directly by CDPM.
kai_sav = { git = "https://github.com/kunalabs-io/sui-smart-contracts.git", subdir = "kai/sav/core", rev = "ded11b33ee88cb6dcd4ea1b1b96c66e20d035ef4" }
kai_leverage = { git = "https://github.com/kunalabs-io/sui-smart-contracts.git", subdir = "kai/leverage/core", rev = "ded11b33ee88cb6dcd4ea1b1b96c66e20d035ef4" }
